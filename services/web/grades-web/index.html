<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>grades-web</title>
</head>
<body>
  <h1>grades platform</h1>
  <p>Static front page. The API is grades-api; the nightly report is grades-report.</p>
  <p>Version: <span id="version">?</span></p>
  <script>
    fetch("version.txt").then(r => r.text()).then(v => {
      document.getElementById("version").textContent = v.trim();
    });
  </script>
</body>
</html>
