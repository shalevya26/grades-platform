name: Setup service
description: Installs the tools that one service needs on the runner

inputs:
  service_path:
    description: Path of the service in the repository (services/python/grades-api)
    required: true
  install_python:
    description: Set up Python, with a cache of pip downloads, if "true"
    default: "false"

runs:
  using: composite
  steps:
    - name: Set up Python
      if: ${{ inputs.install_python == 'true' }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version-file: ${{ inputs.service_path }}/.python-version
        cache: pip
        cache-dependency-path: ${{ inputs.service_path }}/requirements*.txt

    - name: Show the tools
      shell: bash
      env:
        SERVICE_PATH: ${{ inputs.service_path }}
      run: |
        echo "service: $SERVICE_PATH"
        python3 --version
        docker --version
